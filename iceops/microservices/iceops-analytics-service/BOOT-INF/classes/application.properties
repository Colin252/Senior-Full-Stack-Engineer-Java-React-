spring.application.name=iceops-analytics-service

server.port=8088

eureka.client.service-url.defaultZone=http://iceops-discovery-server:8761/eureka/

spring.datasource.url=jdbc:mysql://iceops-mysql:3306/iceops_analytics?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect