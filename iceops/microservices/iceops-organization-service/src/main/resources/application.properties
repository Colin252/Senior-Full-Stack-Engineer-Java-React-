spring.application.name=ICEOPS-ORGANIZATION-SERVICE
server.port=8087

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://iceops-mysql:3306/iceops_organization_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# EUREKA CLIENT
# ===============================
eureka.client.service-url.defaultZone=http://iceops-discovery-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always